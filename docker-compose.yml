version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      STORAGE_DRIVER: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
